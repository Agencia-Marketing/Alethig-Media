backend:
  name: github
  repo: alexisarfn/Alethig-Media
  branch: main
  # Proxy OAuth desplegado en Cloudflare Workers (ver carpeta oauth-worker/).
  base_url: https://decap-oauth.alexisfuel93.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

locale: "es"

collections:
  # ─────────────── AJUSTES ───────────────
  # Datos de marca compartidos (hechos, no se traducen) separados de los
  # textos de navegación/footer (traducibles) — ver src/content/settings/.
  - name: settings
    label: "Ajustes del sitio"
    editor:
      preview: false
    files:
      - name: site
        label: "Marca (compartido, no se traduce)"
        file: "src/content/settings/site.json"
        format: json
        fields:
          - { name: brand, label: "Nombre de marca", widget: string }
          - name: contact
            label: "Datos de contacto"
            widget: object
            fields:
              - { name: email, label: "Email", widget: string }
              - { name: location, label: "Ubicación", widget: string }
          - name: whatsapp
            label: "WhatsApp"
            widget: object
            required: false
            fields:
              - { name: number, label: "Número (solo dígitos, con código de país)", widget: string }
              - { name: display, label: "Número a mostrar", widget: string }
          - name: social
            label: "Redes sociales"
            widget: object
            required: false
            fields:
              - { name: instagram, label: "Instagram (URL)", widget: string, required: false }
              - { name: facebook, label: "Facebook (URL)", widget: string, required: false }
              - { name: tiktok, label: "TikTok (URL)", widget: string, required: false }

      - name: site-es
        label: "Navegación y footer (Español)"
        file: "src/content/settings/site.es.json"
        format: json
        fields:
          - { name: ctaLabel, label: "Texto botón CTA", widget: string }
          - name: nav
            label: "Menú de navegación"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - { name: contactHours, label: "Horario de contacto", widget: string }
          - { name: whatsappMessage, label: "WhatsApp · Mensaje pre-escrito", widget: string }
          - { name: footerTagline, label: "Eslogan del footer", widget: text }
          - name: footerPages
            label: "Footer — Páginas"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - name: footerLinks
            label: "Footer — Enlaces"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - name: footerBottomLinks
            label: "Footer — Enlaces inferiores"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - { name: copyright, label: "Copyright", widget: string }

      - name: site-en
        label: "Navegación y footer (Inglés)"
        file: "src/content/settings/site.en.json"
        format: json
        fields:
          - { name: ctaLabel, label: "Texto botón CTA", widget: string }
          - name: nav
            label: "Menú de navegación"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - { name: contactHours, label: "Horario de contacto", widget: string }
          - { name: whatsappMessage, label: "WhatsApp · Mensaje pre-escrito", widget: string }
          - { name: footerTagline, label: "Eslogan del footer", widget: text }
          - name: footerPages
            label: "Footer — Páginas"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - name: footerLinks
            label: "Footer — Enlaces"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - name: footerBottomLinks
            label: "Footer — Enlaces inferiores"
            widget: list
            fields:
              - { name: label, label: "Texto", widget: string }
              - { name: href, label: "Enlace", widget: string }
          - { name: copyright, label: "Copyright", widget: string }

  # ─────────────── PÁGINAS ───────────────
  - name: pages
    label: "Páginas"
    editor:
      preview: false
    files:
      - name: home
        label: "Inicio"
        file: "src/content/pages/home.es.json"
        format: json
        fields:
          - { name: title, label: "Título de pestaña (SEO)", widget: string }
          - { name: heroTag, label: "Hero · Etiqueta", widget: string }
          - { name: heroHeading, label: "Hero · Titular", widget: string }
          - { name: heroHighlight, label: "Hero · Palabra resaltada", widget: string, required: false }
          - { name: heroParagraph, label: "Hero · Párrafo", widget: text }
          - { name: heroCtaPrimary, label: "Hero · Botón principal", widget: object, fields: [ { name: label, widget: string }, { name: href, widget: string } ] }
          - { name: heroCtaSecondary, label: "Hero · Botón secundario", widget: object, fields: [ { name: label, widget: string }, { name: href, widget: string } ] }
          - { name: heroImage, label: "Hero · Imagen", widget: image }
          - { name: heroImageAlt, label: "Hero · Texto alternativo", widget: string }
          - name: trustBar
            label: "Barra de confianza (debajo del hero)"
            widget: list
            fields:
              - { name: icon, label: "Icono", widget: string }
              - { name: label, label: "Texto", widget: string }
          - { name: servicesTag, label: "Servicios · Etiqueta", widget: string }
          - { name: servicesHeading, label: "Servicios · Titular", widget: string }
          - { name: servicesHighlight, label: "Servicios · Palabra resaltada", widget: string, required: false }
          - { name: servicesSubtitle, label: "Servicios · Subtítulo", widget: text }
          - name: services
            label: "Servicios (tarjetas del home)"
